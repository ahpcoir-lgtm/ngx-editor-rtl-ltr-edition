name: Bug Report
description: File a bug report
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! This is the tracker of **ngx-editor-rtl-ltr-edition**,
        a fork of ngx-editor. If you use the original `ngx-editor` package, please report the problem upstream:
        https://github.com/sibiraj-s/ngx-editor/issues
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also describe the steps to reproduce the problem and what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of ngx-editor-rtl-ltr-edition are you running?
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: angular-version
    attributes:
      label: Angular Version
      description: What version of angular are you using?
      placeholder: 19.2.x
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Edge
  - type: dropdown
    id: direction
    attributes:
      label: Text direction and language
      description: Which direction and locale does the problem happen with?
      multiple: true
      options:
        - Right to left (rtl)
        - Left to right (ltr)
        - Auto direction
        - Persian (fa) locale
        - Arabic (ar) locale
        - English (en) locale
  - type: input
    id: link-to-reproduce
    attributes:
      label: Link to reproduce
      description: A Github repo or a stackblitz/codesandbox link to reproduce the issue
      placeholder: "https://stackblitz.com/github/ahpcoir-lgtm/ngx-editor-rtl-ltr-edition"
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: dropdown
    id: submit-pr
    attributes:
      label: Willing to submit a PR?
      options:
        - 'Yes'
        - 'No'
