# Live demo on GitHub Pages: https://ahpcoir-lgtm.github.io/ngx-editor-rtl-ltr-edition/
# Needs Settings > Pages > Build and deployment > Source: "GitHub Actions" in the repository.
name: Github Pages

on:
  push:
    branches: main
  # allow manual trigger
  workflow_dispatch:

env:
  NODE_VERSION: 24

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: NPM Install
        run: npm ci

      - name: Build the library
        run: npm run build:lib

      # static build (no server), base href /ngx-editor-rtl-ltr-edition/ (angular.json, configuration "pages")
      - name: Build the demo
        run: npx ng build demo --configuration pages

      # the demo has one route; serve it for unknown paths too
      - name: Add a 404 page
        run: cp dist/demo-pages/browser/index.html dist/demo-pages/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/demo-pages/browser

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
