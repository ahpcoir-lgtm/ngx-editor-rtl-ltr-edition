# Publishes dist/ngx-editor-rtl-ltr-edition when a GitHub release is created.
# npm trusted publishing (OIDC, no token) has to be set up for the package on npmjs.com first; the very first
# version of a new package cannot be published that way and is published by hand (npm publish with 2FA).
name: NPM Publish

env:
  NODE_VERSION: 24

on:
  release:
    types: [created]

jobs:
  test-lib:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VERSION}}
          cache: npm

      - run: npm ci

      # build before lint, see tests.yml
      - run: npm run build:lib
      - run: npx ng lint ngx-editor
      - run: npm run check:strict
      - run: npm run test:lib

  publish-npm:
    needs: test-lib
    # forks of this repository do not publish
    if: github.repository == 'ahpcoir-lgtm/ngx-editor-rtl-ltr-edition'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VERSION}}
          registry-url: https://registry.npmjs.org/
          cache: npm

      # staged publishing requires npm 11.15.0 or later
      - run: npm install -g npm@^11.15.0

      - run: npm ci
      - run: npm run build:lib

      # the release waits on npmjs.com until a maintainer approves it with 2FA
      - run: npm stage publish dist/ngx-editor-rtl-ltr-edition/ --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
