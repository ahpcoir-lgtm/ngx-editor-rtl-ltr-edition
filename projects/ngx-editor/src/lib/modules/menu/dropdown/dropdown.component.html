<button
  type="button"
  class="NgxEditor__Dropdown--Text"
  [class.NgxEditor__Dropdown--Selected]="isSelected"
  [disabled]="isDropdownDisabled"
  [class.NgxEditor--Disabled]="isDropdownDisabled"
  (mousedown)="onToggleDropdownMouseClick($event)"
  (keydown.enter)="onToggleDropdownKeydown()"
  (keydown.space)="onToggleDropdownKeydown()"
  [ariaLabel]="getName(activeItem || group()) | async"
  aria-haspopup="listbox"
  [ariaExpanded]="isDropdownOpen"
>
  {{ getName(activeItem || group()) | async }}
</button>

@if (isDropdownOpen) {
  <div
    class="NgxEditor__Dropdown--DropdownMenu"
    role="listbox"
    ngxPopupPosition
    ngxPopupMatchWidth
    ngxPopupAlign="start"
  >
    @for (item of items(); track $index) {
      <button
        type="button"
        class="NgxEditor__Dropdown--Item"
        (mousedown)="onDropdownItemMouseClick($event, item)"
        (keydown.enter)="onDropdownItemKeydown($event, item)"
        (keydown.space)="onDropdownItemKeydown($event, item)"
        [ngClass]="{
          'NgxEditor__Dropdown--Active': isItemActive(item),
          'NgxEditor--Disabled': disabledItems.includes(item),
        }"
        [ariaLabel]="getName(item) | async"
        role="option"
        [attr.aria-selected]="isItemActive(item)"
        [attr.aria-expanded]="hasPalette(item) ? isPaletteOpen : null"
      >
        {{ getName(item) | async }}
      </button>

      @if (hasPalette(item) && isPaletteOpen) {
        <div class="NgxEditor__Dropdown--Palette" role="group" [attr.aria-label]="getName(item) | async">
          @for (colorGroup of presets(); track $index) {
            <div class="NgxEditor__ColorContainer">
              @for (color of colorGroup; track $index) {
                <button
                  type="button"
                  class="NgxEditor__Color"
                  [ngStyle]="{ backgroundColor: color, color: getContrastColor(color) }"
                  [title]="color"
                  [ariaLabel]="color"
                  (mousedown)="onCellBackgroundMouseClick($event, color)"
                  (keydown.enter)="onCellBackgroundKeydown($event, color)"
                  (keydown.space)="onCellBackgroundKeydown($event, color)"
                  [ngClass]="{ 'NgxEditor__Color--Active': isColorActive(color) }"
                ></button>
              }
            </div>
          }
          <button
            type="button"
            class="NgxEditor__MenuItem--Button"
            (mousedown)="onCellBackgroundMouseClick($event, null)"
            (keydown.enter)="onCellBackgroundKeydown($event, null)"
            (keydown.space)="onCellBackgroundKeydown($event, null)"
            [disabled]="!activeColors.length"
          >
            {{ getName('remove') | async }}
          </button>
        </div>
      }
    }
  </div>
}
